<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reset your RWS password</title>
  </head>
  <body style="font-family: Arial, sans-serif; color: #111827; line-height: 1.5;">
    <h2>Reset your RWS password</h2>
    <p>Use the button below to choose a new password.</p>
    <p>
      <a
        href="https://albertoroca96.github.io/retail-inventory-tracker/auth/set-password?token_hash={{ .TokenHash }}&amp;type=recovery"
        style="display: inline-block; padding: 12px 18px; background: #2563eb; color: #ffffff; text-decoration: none; border-radius: 8px;"
      >
        Choose a new password
      </a>
    </p>
    <p>If you did not request this, you can ignore this email.</p>
  </body>
</html>
