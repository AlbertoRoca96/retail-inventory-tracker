# supabase/config.toml

[auth]
site_url = "https://albertoroca96.github.io/retail-inventory-tracker"
additional_redirect_urls = [
  "https://albertoroca96.github.io/retail-inventory-tracker",
  "https://albertoroca96.github.io/retail-inventory-tracker/auth/callback",
  "https://albertoroca96.github.io/retail-inventory-tracker/auth/callback?flow=invite",
  "https://albertoroca96.github.io/retail-inventory-tracker/auth/callback?flow=magiclink",
  "https://albertoroca96.github.io/retail-inventory-tracker/auth/callback?flow=recovery",
  "https://albertoroca96.github.io/retail-inventory-tracker/auth/callback?flow=signup",
]

[auth.email.template.recovery]
subject = "Reset your RWS password"
content_path = "./supabase/templates/recovery.html"

[functions.invite-user]
verify_jwt = false
# path is relative to THIS config file (the supabase/ dir)
entrypoint = "./invite-user/functions/index.ts"

[functions.submission-xlsx]
verify_jwt = false
entrypoint = "./submission-xlsx/functions/index.ts"

[functions.document-preview]
verify_jwt = false
entrypoint = "./document-preview/functions/index.ts"
